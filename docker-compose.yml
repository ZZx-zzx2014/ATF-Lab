# ============================================================
# ATF Lab - docker compose 配置
#
# ⚠️ 仅供教学演示（EDUCATIONAL USE ONLY）
#   本项目是受控的安全教学靶场。
#   请勿在互联网上公开发布、部署或传播。
#
# 启动：docker compose up --build
# 访问：http://127.0.0.1:8899
# ============================================================

services:
  atf-lab:
    build:
      context: .
      dockerfile: Dockerfile
    image: atf-lab:2.0.0-rc1
    container_name: atf-lab
    restart: unless-stopped

    # ⚠️ 只绑定回环地址：不对外网暴露，符合"禁止公网部署"的约定。
    #    如确需局域网访问，把 127.0.0.1 改成 0.0.0.0 并自行承担风险。
    #
    # 端口说明：
    #   主服务 8899 是必需的（前端 + API）。
    #   下面四个仿真服务端口是可选的 —— 它们只用于练习 nmap / nc / redis-cli。
    #   若你本机已装 MySQL(3306)、Redis(6379) 等，会与宿主端口冲突，
    #   导致容器无法启动。此时有两个选择：
    #     A. 注释掉冲突的端口映射（仿真服务仍在容器内可用，只是不映射到宿主）
    #     B. 改左边的宿主端口，例如 "127.0.0.1:13306:3306"
    #   容器内的仿真服务端口始终不变，程序内部有自动回退逻辑。
    ports:
      - "127.0.0.1:8899:8899"      # 主服务（API + 前端 SPA）—— 必需
      # 以下为可选的仿真服务端口映射，与宿主服务冲突时请注释或改左侧端口
      #
      # 注意：Windows 启用 Hyper-V/WSL 后会保留部分端口段（如 2061-2160），
      # 落在保留区间的端口无法绑定，报 "access permissions" 错误。
      # 可用 netsh interface ipv4 show excludedportrange protocol=tcp 查看。
      # 因此仿真 FTP 的宿主端口默认用 12121 而非 2121。
      - "${ATF_HOST_FTP_PORT:-12121}:2121"       # 仿真 FTP
      - "${ATF_HOST_MYSQL_PORT:-13306}:3306"     # 仿真 MySQL（避开真实 MySQL 的 3306）
      - "${ATF_HOST_REDIS_PORT:-16379}:6379"     # 仿真 Redis（避开真实 Redis 的 6379）
      - "${ATF_HOST_DEBUG_PORT:-31337}:31337"    # 仿真调试服务

    environment:
      # ---- 服务 ----
      ATF_HOST: "0.0.0.0"
      ATF_PORT: "8899"
      ATF_DEBUG: "0"

      # ---- 数据库 ----
      ATF_DB_PATH: "/app/data/atf.db"

      # ---- 密钥（生产部署务必修改）----
      # 可用 openssl rand -hex 32 生成
      ATF_SECRET_KEY: "${ATF_SECRET_KEY:-change-me-in-production-please}"
      ATF_TOKEN_TTL: "604800"

      # ---- 预置管理员（可选，留空则由首个注册用户自动成为管理员）----
      ATF_ADMIN_USER: "${ATF_ADMIN_USER:-}"
      ATF_ADMIN_PASSWORD: "${ATF_ADMIN_PASSWORD:-}"

      # ---- 仿真网络服务 ----
      ATF_NETLAB_ENABLED: "1"

    volumes:
      # SQLite 数据持久化：容器重建后进度不丢
      - atf-data:/app/data

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          try:
              r = urllib.request.urlopen('http://127.0.0.1:8899/api/v1/health', timeout=4)
              sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 6s
      start_period: 12s
      retries: 3

volumes:
  atf-data:
    driver: local
